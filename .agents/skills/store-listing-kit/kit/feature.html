<!doctype html><html><head><meta charset="utf-8"><title>Feature graphic</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:var(--bg)}
#c{position:relative;width:1024px;height:500px;overflow:hidden;background:var(--bg);color:var(--fg)}
.glow{position:absolute;left:560px;top:60px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(0,0,0,0) 70%);filter:blur(30px)}
.brand{position:absolute;left:104px;top:112px;display:flex;align-items:center;gap:16px;font:700 30px var(--display),sans-serif;letter-spacing:-.5px}
.brand img{width:56px;height:56px;object-fit:cover;border-radius:var(--logo-radius)}
h1{position:absolute;left:104px;top:196px;margin:0;font:700 76px/1.05 var(--display),var(--script),sans-serif;letter-spacing:-2px;max-width:520px}
h1 em{font-style:normal;color:var(--accent)}
p{position:absolute;left:104px;top:290px;margin:0;font:500 26px/1.35 var(--body),sans-serif;color:var(--muted);max-width:480px}
.phone{position:absolute;left:664px;top:64px;width:330px;height:900px;padding:10px;border-radius:44px;background:var(--bezel);box-shadow:0 0 0 1px var(--rim),0 24px 50px rgba(40,25,10,.28),0 6px 14px rgba(40,25,10,.16)}
.phone img{display:block;width:310px;height:auto;border-radius:34px}
.bub{position:absolute;background:var(--card);border:1px solid var(--cardBorder);border-radius:20px;box-shadow:0 14px 34px rgba(28,25,23,.16);padding:14px 22px;font:500 21px/1.3 var(--body),var(--script),sans-serif;color:var(--fg)}
.bub i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--dot);margin-right:10px}
</style></head><body><div id="c"><div class="glow"></div>
<div class="brand"><img id="logo" alt=""><span id="wm"></span></div>
<h1 id="h"></h1><p id="s"></p>
<div class="phone"><img id="img" alt=""></div></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const cfg=D.config, fe=cfg.feature, root=document.documentElement;
const t=cfg.tokens[fe.mode||'light']; for(const k in t) root.style.setProperty('--'+k,t[k]);
root.style.setProperty('--rim', fe.mode==='dark'?'rgba(255,255,255,.16)':'rgba(0,0,0,0)');
root.style.setProperty('--bezel',(cfg.phone&&cfg.phone.bezel)||'#0E0C0B');
root.style.setProperty('--logo-radius',{circle:'50%',rounded:'22%',square:'0'}[cfg.logoShape||'circle']);
const f=cfg.fonts||{}, fam=r=>f[r]?'"'+f[r].family+'"':'sans-serif';
root.style.setProperty('--display',fam('display'));root.style.setProperty('--body',fam('body'));root.style.setProperty('--script',fam('script'));
const loads=[];
for(const role of ['display','body','script']){const x=f[role];if(!x)continue;
  const srcs=[...(x.local||[]).map(n=>'local("'+n+'")'),...(D.fontSrcs[role]?['url("'+D.fontSrcs[role]+'")']:[])];
  if(srcs.length) loads.push(new FontFace(x.family,srcs.join(','),{weight:String(x.weight||400)}).load().then(l=>document.fonts.add(l)).catch(()=>{}));}
document.getElementById('logo').src=D.logoSrc;
document.getElementById('wm').textContent=cfg.product;
let html=esc(fe.headline); if(fe.emphasis) html=html.replace(esc(fe.emphasis),'<em>$&</em>');
document.getElementById('h').innerHTML=html;
document.getElementById('s').textContent=fe.subline||'';
document.getElementById('img').src=D.imageSrc;
if(fe.bubble){const b=document.createElement('div');b.className='bub';b.style.left=fe.bubble.left+'px';b.style.top=fe.bubble.top+'px';
  b.innerHTML='<i></i>'+esc(fe.bubble.text);document.getElementById('c').appendChild(b);}
Promise.all(loads).then(()=>document.fonts.ready).then(()=>{document.title='ready'});
</script></body></html>
